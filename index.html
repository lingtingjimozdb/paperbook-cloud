<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2f6555" />
  <title>PaperBook Cloud</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="brand">📒 PaperBook Cloud</div>
      <p class="subtitle">你的私人云端电子笔记本</p>

      <div class="auth-tabs">
        <button id="loginTab" class="active">登录</button>
        <button id="signupTab">注册</button>
      </div>

      <form id="authForm">
        <label>邮箱</label>
        <input id="emailInput" type="email" autocomplete="email" required placeholder="name@example.com" />
        <label>密码</label>
        <input id="passwordInput" type="password" autocomplete="current-password" required minlength="6" placeholder="至少 6 位" />
        <button id="authSubmit" class="primary full" type="submit">登录</button>
      </form>

      <button id="forgotBtn" class="link-btn">忘记密码</button>
      <p class="auth-tip">注册后，每个账户拥有独立私人空间。不同用户的数据由数据库权限隔离。</p>
    </div>
  </section>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="brand small">📒 PaperBook</div>
        <button id="themeBtn" title="切换主题">◐</button>
      </div>
      <div class="user-card">
        <div id="userEmail" class="user-email"></div>
        <div id="syncStatus" class="sync-status">已连接云端</div>
      </div>

      <div class="button-row">
        <button id="newNotebookBtn" class="primary">＋ 笔记本</button>
        <button id="renameNotebookBtn">重命名</button>
      </div>
      <div class="section-title">我的笔记本</div>
      <div id="notebookList" class="list"></div>

      <div class="sidebar-footer">
        <button id="exportBtn">导出备份</button>
        <button id="importBtn">导入备份</button>
        <button id="logoutBtn" class="danger">退出登录</button>
      </div>
    </aside>

    <aside class="page-panel">
      <div class="button-row">
        <button id="newPageBtn" class="primary">＋ 新页面</button>
        <button id="deletePageBtn" class="danger">删除</button>
      </div>
      <div class="search-wrap">
        <input id="searchInput" placeholder="搜索当前笔记本…" />
      </div>
      <div class="section-title">页面目录</div>
      <div id="pageList" class="list"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="saveBtn">保存</button>
        <button id="prevBtn">◀ 上一页</button>
        <button id="nextBtn">下一页 ▶</button>
        <span id="pageCounter" class="muted"></span>
        <div class="grow"></div>
        <span id="saveState" class="muted">已保存</span>
      </header>

      <div class="workspace">
        <article class="paper">
          <input id="titleInput" class="title-input" placeholder="页面标题" />
          <input id="tagsInput" class="tags-input" placeholder="标签：用逗号分隔" />
          <div class="formatbar">
            <button data-cmd="bold"><b>B</b></button>
            <button data-cmd="italic"><i>I</i></button>
            <button data-cmd="underline"><u>U</u></button>
            <button data-block="h1">H1</button>
            <button data-block="h2">H2</button>
            <button data-cmd="insertUnorderedList">• 列表</button>
            <button data-cmd="insertOrderedList">1. 列表</button>
            <button data-cmd="removeFormat">清格式</button>
          </div>
          <div id="editor" class="editor" contenteditable="true"></div>
        </article>
      </div>

      <footer class="bottom">
        <button id="bottomPrevBtn">◀</button>
        <div id="pageNumbers" class="page-numbers"></div>
        <button id="bottomNextBtn">▶</button>
        <input id="jumpInput" type="number" min="1" placeholder="页码" />
        <button id="jumpBtn">跳转</button>
      </footer>
    </main>
  </div>

  <input id="importPicker" type="file" accept=".json,application/json" hidden />

  <dialog id="promptDialog">
    <form method="dialog">
      <h3 id="promptTitle">输入</h3>
      <input id="promptInput" />
      <div class="dialog-actions">
        <button value="cancel">取消</button>
        <button id="promptConfirm" class="primary" value="default">确定</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>

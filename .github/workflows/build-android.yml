name: Build PaperBook Android APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable debug APK
        run: |
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk PaperBook-Android-V9.1-AI-Scan.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaperBook-Android-V9.1-AI-Scan
          path: android-app/PaperBook-Android-V9.1-AI-Scan.apk
          retention-days: 30

      - name: Publish V9.1 Android release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v9.1.0-ai-scan
          name: PaperBook Android V9.1 · AI 扫描恢复
          body: |
            PaperBook V9.1 安卓安装包。
            原生扫描结果进入 AI 原图恢复工作台，结合设备 OCR 草稿和视觉模型纠正错字、漏字及版面。
            支持本机免费 OCR、OpenRouter 免费视觉模型和 Gemini 免费额度。
          files: android-app/PaperBook-Android-V9.1-AI-Scan.apk

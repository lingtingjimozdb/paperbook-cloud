name: Build PaperBook Android APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable debug APK
        run: |
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk PaperBook-Android-V9.2-Email-Auth.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaperBook-Android-V9.2-Email-Auth
          path: android-app/PaperBook-Android-V9.2-Email-Auth.apk
          retention-days: 30

      - name: Publish V9.2 Android release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v9.2.0-email-auth
          name: PaperBook Android V9.2 · 邮箱账号与密码找回
          body: |
            PaperBook V9.2 安卓安装包。
            新增邮箱注册、邮箱登录、注册确认邮件、忘记密码邮件和登录后修改密码。
            保留 V9.1 的 AI 原图扫描恢复、OCR 草稿对照与免费视觉模型接口。
          files: android-app/PaperBook-Android-V9.2-Email-Auth.apk
